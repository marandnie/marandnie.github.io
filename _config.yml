# Configuración del sitio. Si la cambiás con `bundle exec jekyll serve` corriendo,
# hay que reiniciar el servidor (este archivo no se recarga solo).
#
# Plan SEO: specs/001-seo/ (spec, plan y tareas).

# --- Identidad del sitio ---
title: El sitio web de Marina
tagline: "Blog y portfolio"
author: Marina Nieto
email: mandieto@gmail.com
description: >-
  Blog y portfolio de Marina Nieto, FinOps Analyst en Buenos Aires: costos de nube,
  AWS, datos y los proyectos que voy desarrollando.
url: "https://mandieto.com.ar" # dominio y protocolo
baseurl: ""                     # subcarpeta del sitio (vacío = raíz)
lang: es-AR
locale: es_AR
timezone: America/Argentina/Buenos_Aires

# Redes (las muestra el pie de página de minima).
# Los perfiles para Google (sameAs) están en _data/person.yml
github_username: marandnie
linkedin_username: marandnie
twitter_username: marinieto

# --- Build ---
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# URLs de posts limpias y descriptivas: /blog/<nombre-del-archivo-sin-fecha>/
permalink: /blog/:title/

minima:
  date_format: "%d/%m/%Y"

defaults:
  # Imagen por defecto al compartir en redes (cada página puede definir su propia `image:`)
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/marina-nieto-og.jpg
        width: 1200
        height: 675
  # Los posts los firma Marina
  - scope:
      path: ""
      type: posts
    values:
      author: Marina Nieto

header_pages:
  - about.md
  - trabajos.md

# Archivos que no se publican. En Jekyll 3 (el de GitHub Pages) esta lista
# reemplaza a la de por defecto, por eso se repite completa.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - specs/
