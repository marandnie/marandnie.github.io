# Centros de Distribución Domiciliaria (CDD) de Correo Argentino en CABA.
# Lo usa la página /correo-argentino-cdd/ (correo-argentino-cdd.md).
#
# Para agregar o corregir un CDD, editá esta lista (ordenada por número):
#   numero:    número del CDD, sin ceros adelante
#   direccion: calle y altura, como figura en el cartel o en Google Maps
#   barrio:    barrio de la Ciudad
#   nota:      opcional, aclaraciones para quien va a retirar
#   fuente:    de dónde salió el dato
#   confirmado: false si el dato viene de una sola fuente poco confiable

